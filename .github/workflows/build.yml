name: CI & Release Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

# only the newest run for a branch keeps going, older ones are cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build Vantra (arm64 GMS release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle (mirrors + retry, for when services.gradle.org is down)
        run: |
          VER=$(grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-(.*)-bin\.zip.*/\1/')
          echo "Gradle $VER"
          fetch() {
            for i in 1 2 3; do
              if curl -fsSL --connect-timeout 20 --max-time 300 -o /tmp/gradle.zip "$1" && unzip -tq /tmp/gradle.zip > /dev/null; then
                return 0
              fi
              echo "failed: $1 (attempt $i)"
              sleep $((i * 10))
            done
            return 1
          }
          ok=0
          for url in \
            "https://services.gradle.org/distributions/gradle-$VER-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-$VER-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VER-bin.zip" \
            "https://mirrors.aliyun.com/gradle/gradle-$VER-bin.zip"; do
            if fetch "$url"; then ok=1; echo "got Gradle from $url"; break; fi
          done
          [ "$ok" = 1 ] || { echo "no Gradle mirror worked"; exit 1; }
          # CI only: point the wrapper at the downloaded zip so the build never hits the dead server
          sed -i 's#^distributionUrl=.*#distributionUrl=file\\:///tmp/gradle.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^validateDistributionUrl=.*#validateDistributionUrl=false#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Remove leftovers of the old mochy source
        run: bash .github/scripts/remove-old-source.sh

      - name: Restore and verify the permanent release key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/signing/restore-release-keystore.sh

      - name: Build Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # a download that hit a 5xx stays cached, so the next attempt only fetches what's missing
          for i in 1 2 3 4; do
            ./gradlew assembleArm64GmsRelease --no-configuration-cache --console=plain --warning-mode summary && exit 0
            echo "Build failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Verify the APK is signed by the pinned release certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          APK=$(find app/build/outputs/apk/arm64Gms/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          [ -n "$APK" ] || { echo "::error::no signed release APK was produced"; exit 1; }
          bash scripts/signing/verify-apk.sh "$APK"

      - name: Remove the decoded keystore from the runner
        if: always()
        run: rm -f app/keystore/release.keystore

      - name: Upload Release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vantra-arm64-release
          path: app/build/outputs/apk/arm64Gms/release/*.apk
          if-no-files-found: error
